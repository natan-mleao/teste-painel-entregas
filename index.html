<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Entregas</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topo">
    <div class="topo__conteudo">
      <h1>Painel de Entregas</h1>
      <p>Obrigações acessórias das empresas clientes do escritório</p>
    </div>
  </header>

  <main class="conteudo">
    <section class="resumo" aria-label="Resumo das entregas">
      <div class="resumo__item">
        <span class="resumo__numero" id="resumo-total">–</span>
        <span class="resumo__rotulo">Total</span>
      </div>
      <div class="resumo__item resumo__item--entregue">
        <span class="resumo__numero" id="resumo-entregues">–</span>
        <span class="resumo__rotulo">Entregues</span>
      </div>
      <div class="resumo__item resumo__item--pendente">
        <span class="resumo__numero" id="resumo-pendentes">–</span>
        <span class="resumo__rotulo">Pendentes</span>
      </div>
      <div class="resumo__item resumo__item--atrasada">
        <span class="resumo__numero" id="resumo-atrasadas">–</span>
        <span class="resumo__rotulo">Atrasadas</span>
      </div>
    </section>

    <section class="cadastro" aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro" class="cadastro__titulo">Nova entrega</h2>
      <form class="cadastro__form" id="form-cadastro" novalidate>
        <label class="campo">
          Empresa
          <select id="cadastro-empresa" name="empresa_id" required>
            <option value="">Selecione…</option>
          </select>
        </label>
        <label class="campo">
          Obrigação
          <select id="cadastro-obrigacao" name="obrigacao_id" required>
            <option value="">Selecione…</option>
          </select>
        </label>
        <label class="campo">
          Competência
          <input type="month" id="cadastro-competencia" name="competencia" required>
        </label>
        <label class="campo">
          Vencimento
          <input type="date" id="cadastro-vencimento" name="vencimento" required>
        </label>
        <button type="submit" class="botao">Cadastrar</button>
      </form>
    </section>

    <form class="filtros" id="form-filtros" aria-label="Filtros da lista">
      <label class="campo campo--busca">
        Empresa
        <input type="search" id="filtro-empresa" name="empresa" placeholder="Buscar pela razão social" autocomplete="off">
      </label>
      <label class="campo">
        Departamento
        <select id="filtro-departamento" name="departamento">
          <option value="">Todos</option>
          <option value="Fiscal">Fiscal</option>
          <option value="Pessoal">Pessoal</option>
          <option value="Contábil">Contábil</option>
        </select>
      </label>
      <label class="campo">
        Status
        <select id="filtro-status" name="status">
          <option value="">Todos</option>
          <option value="pendente">Pendente</option>
          <option value="atrasada">Atrasada</option>
          <option value="entregue">Entregue</option>
        </select>
      </label>
      <button type="button" class="botao botao--secundario" id="limpar-filtros" disabled>Limpar filtros</button>
    </form>

    <div class="acoes-lote">
      <button type="button" class="botao" id="marcar-selecionadas" disabled>Marcar selecionadas como entregues (0)</button>
    </div>

    <div class="tabela-container">
      <table class="tabela">
        <thead>
          <tr>
            <th class="tabela__selecao">
              <input type="checkbox" id="selecionar-todas" aria-label="Selecionar todas as entregas não entregues visíveis">
            </th>
            <th>Empresa</th>
            <th>Obrigação</th>
            <th>Departamento</th>
            <th>Competência</th>
            <th>Vencimento</th>
            <th>Entregue em</th>
            <th>Status</th>
            <th><span class="visualmente-oculto">Ações</span></th>
          </tr>
        </thead>
        <tbody id="lista-entregas">
          <tr><td colspan="9" class="tabela__vazio">Carregando entregas…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <script src="assets/app.js"></script>
</body>
</html>
